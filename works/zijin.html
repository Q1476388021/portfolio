<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫金商业 - 作品详情</title>
    <link rel="stylesheet" href="../assets/finesse.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #111;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #1e1e1eb3;
            display: flex;
            align-items: center;
            backdrop-filter: blur(85px);
            z-index: 1000;
        }

        /* 左侧品牌区域 */
        .brand-box {
            position: absolute;
            left: 5%;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-wrapper {
            border: 2px solid #B3FCE6B3;
            border-radius: 8px;
            padding: 2px;
        }

        .logo {
            display: block;
            width: 36px;
            height: 36px;
            background: url('../assets/头像.jpg') center/cover;
            border-radius: 4px;
        }

        .brand-text {
            font-family: Agency FB;
            font-size: 20px;
            font-weight: 600;
            color: #B3FCE6;
        }

        /* 返回按钮 */
        .back-button {
            position: absolute;
            right: 5%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: #111;
            border: 1px solid #fff;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-button:hover {
            background: #222;
        }

        .back-icon {
            width: 8px;
            height: 8px;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            transform: rotate(-45deg);
        }

        /* 图片容器 */
        .images-container {
            margin-top: 60px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 32px 0;
        }

        .project-image {
            width: 90%;
            max-width: 1920px;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand-box">
            <a href="../index.html" style="text-decoration: none; display: flex; align-items: center; gap: 16px;">
                <div class="logo-wrapper">
                    <div class="logo"></div>
                </div>
                <span class="brand-text">Jorwen.Liu</span>
            </a>
        </div>
        <a href="../zuopin.html" class="back-button">
            <div class="back-icon"></div>
            返回
        </a>
    </nav>

    <div class="images-container">
        <img src="../zuopin/紫金/作品-紫金1.jpg" alt="紫金商业1" class="project-image">
        <img src="../zuopin/紫金/作品-紫金2.jpg" alt="紫金商业2" class="project-image">
        <img src="../zuopin/紫金/作品-紫金3.jpg" alt="紫金商业3" class="project-image">
        <img src="../zuopin/紫金/作品-紫金4.jpg" alt="紫金商业3" class="project-image">
    </div>
<script src="../assets/finesse.js"></script></body>
</html>
