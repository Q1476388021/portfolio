<head>

    <style>
       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background: #0b1016;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .home-page {
            overflow-x: hidden;
            background: #0b1016 !important;
            margin: 0;
            padding: 0;
        }

        .home-page main {
            position: relative;
            z-index: 2;
        }

        #home-field {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }

        .background-image {
            min-height: calc(100vh - 60px);
            width: 100%;
            padding-top: 0;
            position: relative;
            z-index: 2;
        }

        nav {
            position: sticky;
            top: 0;
            height: 60px;
            background: #1e1e1eb3;
            display: flex;
            align-items: center;
            backdrop-filter: blur(85px);
            z-index: 1000;
        }

        /* 左侧品牌区域 */
        .brand-box {
            position: absolute;
            left: 5%;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-wrapper {
            border: 2px solid #B3FCE6B3;
            /* 外描边 */
            border-radius: 8px;
            padding: 2px;
        }

        .logo {
            display: block;
            width: 36px;
            height: 36px;
            background: url('assets/头像.jpg') center/cover;
            /* 替换实际图片 */
            border-radius: 4px;
        }

        .brand-text {
            font-family: Agency FB;
            font-size: 20px;
            font-weight: 600;
            color: #B3FCE6;
        }

        /* 右侧导航菜单 */
        .nav-menu {
            position: absolute;
            right: 5%;
            display: flex;
            gap: 100px;
            font-family: Alibaba PuHuiTi 3.0;
        }

        .nav-item {
            position: relative;
            font-size: 16px;
            font-weight: 400;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
            padding: 8px 0;
        }

        /* 下划线动画 */
        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 3px;
            background: #B3FCE6;
            transition: width 0.3s;
        }

        .nav-item:hover::after,
        .nav-item.active::after {
            width: 100%;
        }

        .nav-item:hover {
            color: #B3FCE6;
        }
        .lang-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 0;
        }
        .lang-switch-track {
            position: relative;
            width: 60px;
            height: 26px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 13px;
            transition: background 0.3s;
            border: 1px solid rgba(179, 252, 230, 0.3);
        }
        .lang-switch-track:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .lang-switch-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .lang-switch-track.active .lang-switch-thumb {
            transform: translateX(34px);
            background: #B3FCE6;
        }
        .lang-switch-track.active {
            background: rgba(179, 252, 230, 0.2);
        }
        .lang-label {
            font-size: 12px;
            font-weight: 400;
            color: #888;
            transition: color 0.3s;
            min-width: 24px;
        }
        .lang-switch:hover .lang-label {
            color: #B3FCE6;
        }

        /* 筛选区域样式 */
        .filters-container {
            position: sticky;
            top: 60px;
            left: 0;
            width: 100%;
            display: flex;
            gap: 12px;
            z-index: 999;
            flex-wrap: wrap;
            padding: 20px 5%;
            margin-bottom: 0;
            background: rgba(11, 16, 22, 0.85);
            backdrop-filter: blur(10px);
        }

        .filter-button {
            padding: 6px 16px;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(132, 192, 165, 0.2);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-family: Alibaba PuHuiTi 3.0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-button:hover {
            color: #84C0A5;
            border-color: rgba(132, 192, 165, 0.5);
        }

        .filter-button.active {
            color: #B3FCE6;
            border-color: #84C0A5;
            background: rgba(132, 192, 165, 0.15);
            box-shadow: 0 0 10px rgba(132, 192, 165, 0.2);
        }

        /* 作品展示区域样式 */
        .works-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: min-content;
            gap: 32px 16px;
            padding: 0 5% 32px;
            margin-top: 0;

        .work-item {

            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            border-radius: var(--card-radius);
            padding: 0 4px 24px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .work-image {
            width: 100%;
            aspect-ratio: 412 / 216;
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .work-item:hover .work-image img {
            transform: scale(1.05);
        }

        .work-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 16px;
            font-family: Alibaba PuHuiTi 3.0;
        }

        .work-title {
            margin: 0 5% 8px 5%;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
        }

        .work-category {
            margin: 0 5% 24px 5%;
            color: #888;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
        }

        .work-status {
            margin: 0 5% 0 5%;
            color: #84C0A5;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
        }
    </style>
</head>

    <script>
        // 粒子背景动画
        (() => {
            const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
            const canvas = document.querySelector('#home-field');
            const ctx = canvas.getContext('2d');
            let w, h, points = [];
            const resize = () => {
                w = canvas.width = innerWidth * devicePixelRatio;
                h = canvas.height = innerHeight * devicePixelRatio;
                ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
                points = Array.from({ length: Math.min(70, Math.floor(innerWidth / 20)) }, () => ({
                    x: Math.random() * innerWidth,
                    y: Math.random() * innerHeight,
                    vx: (Math.random() - .5) * .22,
                    vy: (Math.random() - .5) * .22
                }));
            };
            const draw = () => {
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                points.forEach((p, i) => {
                    p.x = (p.x + p.vx + innerWidth) % innerWidth;
                    p.y = (p.y + p.vy + innerHeight) % innerHeight;
                    ctx.fillStyle = 'rgba(179, 252, 230, .5)';
                    ctx.fillRect(p.x, p.y, 1.1, 1.1);
                    for (let j = i + 1; j < points.length; j++) {
                        const q = points[j], d = Math.hypot(p.x - q.x, p.y - q.y);
                        if (d < 120) {
                            ctx.strokeStyle = `rgba(179, 252, 230, ${(1 - d / 120) * .055})`;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(q.x, q.y);
                            ctx.stroke();
                        }
                    }
                });
                if (!RM) requestAnimationFrame(draw);
            };
            resize();
            draw();
            addEventListener('resize', resize);
        })();

        // 筛选功能
        const filterButtons = document.querySelectorAll('.filter-button');
        const workItems = document.querySelectorAll('.work-item');
        let activeFilter = { filter: 'all', value: '全部' };

        function filterWorks() {
            workItems.forEach(item => {
                if (!activeFilter || activeFilter.filter === 'all') {
                    item.style.display = 'flex';
                    return;
                }

                const platformMatch = activeFilter.filter === 'platform' && item.dataset.platform === activeFilter.value;
                const typeMatch = activeFilter.filter === 'type' && item.dataset.type === activeFilter.value;
                item.style.display = platformMatch || typeMatch ? 'flex' : 'none';
            });
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                const filter = button.dataset.filter;
                const value = button.dataset.value;
                const isActive = button.classList.contains('active');

                if (isActive) {
                    button.classList.remove('active');
                    activeFilter = null;
                } else {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    activeFilter = { filter, value };
                }

                filterWorks();
            });
        });

        // 筛选栏吸顶处理：解决 sticky 占位导致下方间距变大的问题
        const filtersEl = document.querySelector('.filters-container');
        const worksEl = document.querySelector('.works-container');
        const navEl = document.querySelector('nav');
        let isFixed = false;

        function handleSticky() {
            const navHeight = navEl.offsetHeight;
            const filtersHeight = filtersEl.offsetHeight;
            // filtersEl.offsetTop 是相对于 offsetParent 的位置，这里取相对文档顶部
            const filtersTop = filtersEl.getBoundingClientRect().top + window.scrollY;

            if (window.scrollY + navHeight >= filtersTop) {
                if (!isFixed) {
                    isFixed = true;
                    filtersEl.style.position = 'fixed';
                    filtersEl.style.top = navHeight + 'px';
                    filtersEl.style.left = '0';
                    filtersEl.style.width = '100%';
                    worksEl.style.marginTop = filtersHeight + 'px';
                }
            } else {
                if (isFixed) {
                    isFixed = false;
                    filtersEl.style.position = 'sticky';
                    filtersEl.style.top = navHeight + 'px';
                    filtersEl.style.left = '';
                    filtersEl.style.width = '';
                    worksEl.style.marginTop = '0';
                }
            }
        }

        window.addEventListener('scroll', handleSticky, { passive: true });
        window.addEventListener('resize', handleSticky);
        handleSticky();
    </script>
